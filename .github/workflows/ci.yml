name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 25+ doesn't ship Corepack
      - name: Install dependencies 🔧
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable
      - name: Lint 🔍
        run: yarn run lint
      - name: Type check
        run: yarn run typecheck
      - name: Build
        run: yarn run build
      - name: Unit tests ✅
        run: yarn run test
      - name: Type tests
        run: yarn run test:types
      - name: Smoke tests of the build
        run: yarn run test:smoke
      - name: Package checks (publint, attw) 📦
        run: yarn run lint:package
