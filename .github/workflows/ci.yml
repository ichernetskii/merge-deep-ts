name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 25+ doesn't ship Corepack
      - name: Install dependencies 🔧
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable
      - name: Lint 🔍
        run: yarn run lint
      - name: Type check
        run: yarn run typecheck
      - name: Build
        run: yarn run build
      - name: Unit tests ✅
        run: yarn run test
      - name: Coveralls 📊
        if: github.event_name == 'push' && matrix.node == 24
        uses: coverallsapp/github-action@v2
        with:
          # an outage of the service shouldn't fail the build
          fail-on-error: false
      - name: Type tests
        run: yarn run test:types
      - name: Smoke tests of the build
        run: yarn run test:smoke
      - name: Package checks (publint, attw) 📦
        run: yarn run lint:package
  smoke:
    name: Smoke tests of the build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # the build runs on the same Node version as in the verify job
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies and build 🔧
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable && yarn run build
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke tests of the build
        run: node --test test/smoke/esm.test.mjs test/smoke/cjs.test.cjs
  types-compat:
    name: Types with TypeScript 4.9-7.x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies 🔧
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable
      # the packed package is installed with npm into temporary projects, see the script
      - name: Type tests of the package with different TypeScript versions
        run: yarn run test:types-compat
