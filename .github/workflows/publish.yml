name: Publish to NPM
on:
  release:
    types: [published]
permissions:
  contents: read
  # npm trusted publishing (OIDC) and provenance
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Install dependencies and build 🔧
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable && yarn run build
      - name: Lint 🔍
        run: yarn run lint && yarn run typecheck
      - name: Setup Testspace 🚀
        uses: testspace-com/setup-testspace@v1
        with:
          domain: ${{ github.repository_owner }}
      - name: Run tests ✅
        run: yarn run test && yarn run test:types && yarn run test:smoke
      - name: Push result to Testspace server
        run: |
          testspace ./reports/report.xml
        if: always()
      - name: Coveralls GitHub Action 📊
        uses: coverallsapp/github-action@v2
      - name: Check package 📦
        run: yarn run lint:package
      # No token: npm trusted publishing authenticates this workflow, see https://docs.npmjs.com/trusted-publishers
      - name: Publish package on NPM 📦
        run: yarn npm publish --provenance
